[env:uno_r4_wifi]
lib_deps = 
	olikraus/U8g2
	adafruit/DHT sensor library@^1.4.7
platform = renesas-ra
board = uno_r4_wifi
framework = arduino

[env:native]
platform = native
test_framework = unity
lib_deps = adafruit/DHT sensor library@^1.4.7
