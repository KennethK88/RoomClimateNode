; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
extra_configs = 
	node_settings_example.ini
	secret_settings_example.ini
	secret_settings.ini
	node_settings.ini
	firmware_version.ini

[env:native]
platform = native
lib_extra_dirs =
	external/embedded_node_libs/lib
test_framework = unity
test_filter = 
	test_evaluation
	test_sensors
lib_ignore = 
	drivers
	connectivity

[env:lolin_d32_test]
extends = env:base
test_framework = unity
test_filter = test_embedded
lib_deps = 
	${env:base.lib_deps}
	throwtheswitch/Unity@^2.6.1
build_flags =
	${env:base.build_flags}
	${node_embedded_test.node_flags}

[env:base]
lib_deps = 
	arduino-libraries/ArduinoMqttClient@^0.1.8
lib_extra_dirs =
	external/embedded_node_libs/lib
platform = espressif32
framework = arduino
board = lolin_d32
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17 
	${secrets.wifi_flags}
	${secrets.mqtt_flags}
	${secrets.ota_flags}
	${firmware.version_flags}

[env:node01]
extends = env:base
build_flags =
	${env:base.build_flags}
	${node01.node_flags}

[env:node01_ota]
extends = env:node01
upload_protocol = espota
upload_port = ${node01.ota_upload_port}
upload_flags = --auth=${secrets.ota_pass}

[env:node02]
extends = env:base
build_flags =
	${env:base.build_flags}
	${node02.node_flags}

[env:node02_ota]
extends = env:node02
upload_protocol = espota
upload_port = ${node02.ota_upload_port}
upload_flags = --auth=${secrets.ota_pass}

