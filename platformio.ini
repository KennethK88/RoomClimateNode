; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
extra_configs = secret_settings.ini

[secrets]
wifi_flags = 
	-D SECRET_SSID=\"dummy_ssid\"
	-D SECRET_PASS=\"dummy_password\"
mqtt_flags = 
	-D MQTT_BROKER='"12345"'
	-D MQTT_PORT=12345
	-D MQTT_USER='"dummy_user"'
	-D MQTT_PASS='"dummy_password"'
	-D MQTT_CLIENT_ID='"dummy_client"'

[env:native]
platform = native
test_framework = unity
test_filter = 
	test_evaluation
	test_sensors
lib_ignore = 
	drivers
	connectivity

[env:uno_r4_wifi_test]
extends = env:uno_r4_wifi
test_framework = unity
test_filter = test_embedded
lib_deps = 
	${env:uno_r4_wifi.lib_deps}
	throwtheswitch/Unity@^2.6.1
test_port = COM5

[env:esp32_lolin_d32]
lib_deps = 
	arduino-libraries/ArduinoMqttClient@^0.1.8
platform = espressif32
framework = arduino
board = lolin_d32
build_flags = 
	${secrets.wifi_flags}
	${secrets.mqtt_flags}