; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
extra_configs = secret_settings.ini

[env:uno_r4_wifi]
lib_extra_dirs = ../HardwareDriver/lib
platform = renesas-ra
board = uno_r4_wifi
framework = arduino
upload_port = COM5
build_flags = ${secrets.wifi_flags}

[env:native]
platform = native
test_framework = unity
test_filter = test_evaluation, test_sensors
lib_ignore = drivers

[env:uno_r4_wifi_test]
extends = env:uno_r4_wifi
test_framework = unity
test_filter = test_embedded
lib_deps = 
	${env:uno_r4_wifi.lib_deps}
	throwtheswitch/Unity@^2.6.1
test_port = COM5

