; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
extra_configs = 
	node_settings_example.ini
	secret_settings_example.ini
	secret_settings.ini
	node_settings.ini

[env:native]
platform = native
test_framework = unity
test_filter = 
	test_evaluation
	test_sensors
lib_ignore = 
	drivers
	connectivity

[env:uno_r4_wifi_test]
extends = env:base
test_framework = unity
test_filter = test_embedded
lib_deps = 
	${env:uno_r4_wifi.lib_deps}
	throwtheswitch/Unity@^2.6.1
test_port = COM5

[env:base]
lib_deps = 
	arduino-libraries/ArduinoMqttClient@^0.1.8
platform = espressif32
framework = arduino
board = lolin_d32
build_flags = 
	${secrets.wifi_flags}
	${secrets.mqtt_flags}

[env:node01]
extends = env:base
build_flags =
	${env:base.build_flags}
	${node01.node_flags}

[env:node02]
extends = env:base
build_flags =
	${env:base.build_flags}
	${node02.node_flags}

[env:node03]
extends = env:base
build_flags =
	${env:base.build_flags}
	${node03.node_flags}