# Name des Workflows
name: PlatformIO Native Tests and Build

# Wann soll Workflow gestartet werden?
on:
  push:
    branches:
    - "**"
  pull_request:
    branches:
    - main
    
# Was soll passieren?
jobs:
  # 1. Job: Native Tests
  native-tests:
    # Ubuntu VM
    runs-on: ubuntu-latest
    # Schritte des Workflows
    steps:
      # 1. Schritt: Checkout auf VM
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.HARDWARE_DRIVER_TOKEN }}
      # 2. Schritt: Python installieren, da Platform IO hierdrauf basiert
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # 3. Schritt: PlatformIO installieren
      - name: Install PlatformIO
        run: python -m pip install platformio
      # ?. Schritt: Caching tbd
      # 4. Schritt: Native Tests ausführen
      - name: Run Native Tests
        run: pio test -e native
  # 2. Job: Build
  arduino-build:
    # Ubuntu VM
    runs-on: ubuntu-latest
    # Schritte des Workflows
    steps:
      # 1. Schritt: Checkout auf VM
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.HARDWARE_DRIVER_TOKEN }}
      # 2. Schritt: Zugriff auf privates Repository für HardwareDriver ermöglichen
      - name: Authenticate private repositories
        run: git config --global url."https://x-access-token:${{ secrets.HARDWARE_DRIVER_TOKEN }}@github.com/".insteadOf "https://github.com/"  
      # 3. Schritt: Python installieren, da Platform IO hierdrauf basiert
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # 4. Schritt: PlatformIO installieren
      - name: Install PlatformIO
        run: python -m pip install platformio
      # 5. Schritt: Build ausführen
      - name: Build
        run: pio run -e uno_r4_wifi
