# Name des Workflows
name: Build Documentation

# Wann soll Workflow gestartet werden?
on:
  push:
    branches:
    - "**"
  pull_request:
    branches:
      - main
  # Run Button fuer Workflow (Unabhaengigkeit von neuen Commits)
  workflow_dispatch:

permissions:
  contents: read

# Was soll passieren?
jobs:
  # 1. Job: Documentation
  documentation:
    # Ubuntu VM
    runs-on: ubuntu-26.04
    # Schritte des Workflows
    steps:
      # 1. Schritt: Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      # 2. Schritt: Checkout Submodule
      - name: Checkout Private Submodules
        env:
          SUBMODULE_TOKEN: ${{ secrets.CI_SUBMODULE_TOKEN }}
        run: |
          git -c "url.https://x-access-token:${SUBMODULE_TOKEN}@github.com/.insteadOf=https://github.com/" \
            submodule update --init --recursive
      # 3. Schritt: Doxygen und Graphviz installieren
      - name: Install Doxygen and Graphviz
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz
      # 4. Schritt: Doxygen ausführen
      - name: Run Doxygen
        run: doxygen docs/Doxyfile
      # 5. Schritt: Generierte Documentation Artefakte (unter docs/html) hochladen
      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: doxygen-html
          path: docs/html
          if-no-files-found: error
