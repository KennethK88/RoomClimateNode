# Workflow name
name: Firmware Builds

# Workflow triggers
on:
  push:
    branches:
    - "**"
  pull_request:
    branches:
    - main

permissions:
  contents: read    

# Jobs
jobs:
  # 1. Job: Build ESP32
  build-esp32:
    strategy:
      fail-fast: false
      matrix:
        environment: [node01, node02, node03, node04, node05, node05_c3_pico, node06]

    # Ubuntu runner
    runs-on: ubuntu-26.04

    # Workflow steps
    steps:
      # 1. Step: Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive

      # 2. Step: Install Python (required by PlatformIO)
      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      # 3. Step: Install PlatformIO
      - name: Install PlatformIO
        run: python -m pip install platformio

      # 4. Step: Build firmware
      - name: Build Firmware
        run: pio run -e ${{ matrix.environment }}