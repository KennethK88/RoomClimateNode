# Name des Workflows
name: Firmware Builds

# Wann soll Workflow gestartet werden?
on:
  push:
    branches:
    - "**"
  pull_request:
    branches:
    - main

permissions:
  contents: read    

# Was soll passieren?
jobs:
  # 1. Job: Build ESP32
  build-esp32:
    strategy:
      fail-fast: false
      matrix:
        environment: [node01, node02, node03, node04, node05, node05_c3_pico, node06]
    # Ubuntu VM
    runs-on: ubuntu-26.04
    # Schritte des Workflows
    steps:
      # 1. Schritt: Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      # 2. Schritt: Checkout Submodule
      - name: Checkout Private Submodules
        env:
          SUBMODULE_TOKEN: ${{ secrets.CI_SUBMODULE_TOKEN }}
        run: |
          git -c "url.https://x-access-token:${SUBMODULE_TOKEN}@github.com/.insteadOf=https://github.com/" \
            submodule update --init --recursive
      # 3. Schritt: Python installieren, da Platform IO hierdrauf basiert
      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      # 4. Schritt: PlatformIO installieren
      - name: Install PlatformIO
        run: python -m pip install platformio
      # 5. Schritt: Builds ausführen
      - name: Build Firmware
        run: pio run -e ${{ matrix.environment }}
