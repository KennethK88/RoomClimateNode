# Workflow name
name: Native Tests

# Workflow triggers
on:
  push:
    branches:
    - "**"
  pull_request:
    branches:
    - main

permissions:
  contents: read

# Jobs
jobs:
  # 1. Job: Native Tests
  native-tests:
    # Ubuntu runner
    runs-on: ubuntu-26.04

    # Workflow steps
    steps:
      # 1. Step: Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive

      # 2. Step: Install Python (required by PlatformIO)
      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      # 3. Step: Install PlatformIO
      - name: Install PlatformIO
        run: python -m pip install platformio

      # 4. Step: Run native tests
      - name: Run Native Tests
        run: pio test -e native