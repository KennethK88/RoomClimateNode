mqtt:
  sensor:
    - name: "Temperatur"
      unique_id: room-climate-node-dummy-room-01-temperature
      state_topic: "roomclimatenode/dummyroom01/temperature"
      expire_after: !include expire_after.yml
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      force_update: true
      suggested_display_precision: 1
      device:
        identifiers:
          - room-climate-node-dummy-room-01
        name: "Raumklima Beispielraum 01"
        manufacturer: "Example Manufacturer"
        model: "RoomClimateNode"

    - name: "Luftfeuchtigkeit"
      unique_id: room-climate-node-dummy-room-01-humidity
      state_topic: "roomclimatenode/dummyroom01/humidity"
      expire_after: !include expire_after.yml
      unit_of_measurement: "%"
      device_class: humidity
      state_class: measurement
      force_update: true
      device:
        identifiers:
          - room-climate-node-dummy-room-01
        name: "Raumklima Beispielraum 01"
        manufacturer: "Example Manufacturer"
        model: "RoomClimateNode"

    - name: "Batterie"
      unique_id: room-climate-node-dummy-room-01-battery
      state_topic: "roomclimatenode/dummyroom01/battery_level"
      expire_after: !include expire_after.yml
      unit_of_measurement: "%"
      device_class: battery
      state_class: measurement
      force_update: true
      device:
        identifiers:
          - room-climate-node-dummy-room-01
        name: "Raumklima Beispielraum 01"
        manufacturer: "Example Manufacturer"
        model: "RoomClimateNode"

    - name: "Firmwareversion"
      unique_id: room-climate-node-dummy-room-01-firmware-version
      state_topic: "roomclimatenode/dummyroom01/firmware/version"
      icon: mdi:chip
      entity_category: diagnostic
      device:
        identifiers:
          - room-climate-node-dummy-room-01
        name: "Raumklima Beispielraum 01"
        manufacturer: "Example Manufacturer"
        model: "RoomClimateNode"

  binary_sensor:
    - name: "OTA Updatefenster"
      unique_id: room-climate-node-dummy-room-01-ota-status
      state_topic: "roomclimatenode/dummyroom01/ota/status"
      payload_on: "window_open"
      payload_off: "window_closed"
      device:
        identifiers:
          - room-climate-node-dummy-room-01
        name: "Raumklima Beispielraum 01"
        manufacturer: "Example Manufacturer"
        model: "RoomClimateNode"

  switch:
    - name: "OTA Update"
      unique_id: room-climate-node-dummy-room-01-ota-request
      command_topic: "roomclimatenode/dummyroom01/ota/request"
      state_topic: "roomclimatenode/dummyroom01/ota/request"
      payload_on: "true"
      payload_off: "false"
      state_on: "true"
      state_off: "false"
      retain: true
      qos: 1
      device:
        identifiers:
          - room-climate-node-dummy-room-01
        name: "Raumklima Beispielraum 01"
        manufacturer: "Example Manufacturer"
        model: "RoomClimateNode"